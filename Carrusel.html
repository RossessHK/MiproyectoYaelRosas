<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deforestación del suelo... Nuestro proyecto</title>
  <link rel="stylesheet" href="Estilos.css">
  <style>
    /* Estilos para asegurar la matriz 2x3 con tamaño uniforme y zoom */
    .matriz-2x3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 25px 0;
      padding: 10px;
    }

    .caja-imagen {
      width: 100%;
      height: 200px;
      overflow: hidden;
      border: 2px solid pink;
      border-radius: 8px;
      background-color: #111;
      box-shadow: 0 4px 8px rgba(255, 192, 203, 0.2);
    }

    .foto-estandar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
      cursor: pointer;
    }

    /* Efecto Zoom interactivo al pasar el cursor */
    .caja-imagen:hover .foto-estandar {
      transform: scale(1.3);
    }
  </style>
</head>
<body>

  <div class="marquesina-contenedor">
    <!-- Título principal -->
    <h1 class="titulo">Deforestación del suelo... Nuestro proyecto</h1>
    <p class="nombre">Yael Rosas - Galería Interactiva</p>

    <!-- Matriz de 2x3 con las 6 imágenes numeradas -->
    <div class="matriz-2x3">
      
      <div class="caja-imagen">
        <a href="Mis imagenes/imagen 1.jpg" target="_blank">
          <img src="Mis imagenes/imagen 1.jpg" alt="Deforestación 1" class="foto-estandar">
        </a>
      </div>

      <div class="caja-imagen">
        <a href="Mis imagenes/imagen 2.jpg" target="_blank">
          <img src="Mis imagenes/imagen 2.jpg" alt="Deforestación 2" class="foto-estandar">
        </a>
      </div>

      <div class="caja-imagen">
        <a href="Mis imagenes/imagen 3.jpg" target="_blank">
          <img src="Mis imagenes/imagen 3.jpg" alt="Deforestación 3" class="foto-estandar">
        </a>
      </div>

      <div class="caja-imagen">
        <a href="Mis imagenes/imagen 4.jpg" target="_blank">
          <img src="Mis imagenes/imagen 4.jpg" alt="Deforestación 4" class="foto-estandar">
        </a>
      </div>

      <div class="caja-imagen">
        <a href="Mis imagenes/imagen 5.jpg" target="_blank">
          <img src="Mis imagenes/imagen 5.jpg" alt="Deforestación 5" class="foto-estandar">
        </a>
      </div>

      <div class="caja-imagen">
        <a href="Mis imagenes/imagen 6.jpg" target="_blank">
          <img src="Mis imagenes/imagen 6.jpg" alt="Deforestación 6" class="foto-estandar">
        </a>
      </div>

    </div>

    <!-- Botón para regresar a la página de inicio -->
    <div style="margin-top: 30px;">
      <a href="index.html" class="btn-enlace">Regresar a la página de inicio</a>
    </div>
  </div>

</body>
</html>
